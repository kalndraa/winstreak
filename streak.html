<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Streak Counter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #2a2a2a;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #aaaaaa;
        }
        .counter {
            font-size: 7rem;
            font-weight: bold;
            margin: 20px 0;
            color: #4caf50;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-add {
            background-color: #4caf50;
            color: white;
        }
        .btn-reset {
            background-color: #e53935;
            color: white;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WIN STREAK</h1>
        <div class="counter" id="streak-display">0</div>
        
        <div class="btn-group">
            <button class="btn-add" onclick="addWin()">+ Add Win</button>
            <button class="btn-reset" onclick="resetWin()">Reset Win</button>
        </div>
    </div>

    <script>
        let streak = localStorage.getItem('winStreak') ? parseInt(localStorage.getItem('winStreak')) : 0;
        const display = document.getElementById('streak-display');

        display.innerText = streak;

        function addWin() {
            streak++;
            updateDisplay();
        }

        function resetWin() {
            streak = 0;
            updateDisplay();
        }

        function updateDisplay() {
            display.innerText = streak;
            localStorage.setItem('winStreak', streak);
        }

        document.addEventListener('keydown', function(event) {
            if (event.key.toLowerCase() === 'w') {
                addWin();
            } else if (event.key.toLowerCase() === 'r') {
                resetWin();
            }
        });
    </script>

</body>
</html>
